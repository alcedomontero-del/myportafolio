<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convertidor de unidades y medidas gratis — Alcedo Montero</title>
<meta name="description" content="Convierte longitud, peso, volumen y temperatura al instante, 100% en tu navegador." />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/publico.css" />
</head>
<body class="publico">

  <header class="pub-header">
    <div class="pub-contenedor pub-header-fila">
      <a href="../index.html" class="pub-logo">Alcedo Montero</a>
      <nav class="pub-nav" aria-label="Navegación principal">
        <a href="../index.html#proyectos">Proyectos</a>
        <a href="../herramientas.html">Herramientas</a>
        <a href="../index.html#contacto">Contacto</a>
      </nav>
      <div class="punto-estado" id="punto-estado" tabindex="0">
        <span class="info-punto" id="info-punto"></span>
      </div>
    </div>
  </header>

  <main>
    <div class="pub-contenedor">
      <section class="pub-herramienta-header">
        <a class="pub-herramienta-volver" href="../herramientas.html">← Todas las herramientas</a>
        <h1><span>📏</span> Convertidor de unidades y medidas</h1>
        <p>Convierte longitud, peso, volumen y temperatura. El resultado se actualiza mientras escribes.</p>
      </section>

      <section class="pub-herramienta-panel">
        <div class="pub-campo">
          <label for="un-categoria">Categoría</label>
          <select id="un-categoria">
            <option value="longitud">Longitud</option>
            <option value="peso">Peso</option>
            <option value="volumen">Volumen</option>
            <option value="temperatura">Temperatura</option>
          </select>
        </div>

        <div class="pub-fila-campos">
          <div class="pub-campo">
            <label for="un-valor">Valor</label>
            <input type="number" id="un-valor" value="1" inputmode="decimal" />
          </div>
          <div class="pub-campo">
            <label for="un-unidad-desde">De</label>
            <select id="un-unidad-desde"></select>
          </div>
          <div class="pub-campo">
            <label for="un-unidad-hasta">A</label>
            <select id="un-unidad-hasta"></select>
          </div>
        </div>

        <button type="button" class="pub-btn pub-btn-secundario" id="btn-un-intercambiar">⇅ Intercambiar unidades</button>

        <div class="pub-resultado mostrar" id="resultado-un" style="margin-top:20px;">
          <div class="pub-campo">
            <label>Resultado</label>
            <div style="font-family: var(--pub-fuente-mono); font-size:1.6rem; font-weight:700;" id="un-salida">—</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="pub-footer">
    <div class="pub-contenedor pub-footer-fila">
      <span>© <span id="anio-actual"></span> Alcedo Montero</span>
      <span style="display:flex; align-items:center; gap:16px;">
        <a class="pub-footer-paypal" id="link-paypal" href="#" target="_blank" rel="noopener" hidden>💛 Invitarme un café (PayPal)</a>
        <span id="badge-modo"></span>
      </span>
    </div>
  </footer>

  <script src="../js/env.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/boot.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/comun-publico.js"></script>
  <script src="../js/herramientas/unidades.js"></script>
</body>
</html>
