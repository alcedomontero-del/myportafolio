<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso — Panel administrador</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/admin-lcars.css" />
</head>
<body class="lcars">

  <div class="lcars-login-envoltorio">
    <div class="lcars-login-caja">
      <div class="lcars-login-cierre"><span>Acceso restringido</span></div>
      <div class="lcars-login-panel">
        <h1 class="lcars-login-titulo">Panel administrador</h1>

        <div id="badge-modo" style="margin-bottom:18px; text-align:center;"></div>

        <p class="lcars-login-error" id="login-error"></p>

        <form id="form-login" novalidate>
          <div class="lcars-campo">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" autocomplete="username" required />
          </div>
          <div class="lcars-campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="lcars-btn lcars-btn-naranja" style="width:100%;" id="btn-login">
            Entrar
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Animación "encendiendo sistemas" — oculta por defecto -->
  <div class="lcars-arranque" id="arranque" hidden>
    <div class="lcars-arranque-barra"><span></span></div>
    <p class="lcars-arranque-texto">Encendiendo sistemas…</p>
  </div>

  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
